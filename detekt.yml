config:
  validation: true
  warningsAsErrors: false
  build:
    maxIssues: 1000

processors:
  active: true

console-reports:
  active: true

rules:
  comments:
    active: true
  complexity:
    active: true
    LongMethod:
      active: true
      threshold: 120
      ignoreAnnotated: [Composable]
    LongParameterList:
      active: true
      threshold: 10
      ignoreDefaultParameters: true
      ignoreDataClasses: true
      ignoreAnnotated: [Composable]
  empty-blocks:
    active: true
  naming:
    active: true
    FunctionNaming:
      active: true
      ignoreAnnotated: [Composable]
      functionPattern: '[a-z][a-zA-Z0-9]*'
  style:
    active: true
    MagicNumber:
      active: true
      ignoreAnnotated: [Composable]
      ignorePropertyDeclaration: true
      ignoreLocalVariableDeclaration: false
      ignoreNamedArgument: true
      ignoreEnums: true
    MaxLineLength:
      active: true
      maxLineLength: 140
      excludePackageStatements: true
      excludeImportStatements: true
    NewLineAtEndOfFile:
      active: true

potential-bugs:
  active: true
  TooGenericExceptionCaught:
    active: true
    excludes: ['**/presentation/**']
